name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zawaj
          POSTGRES_PASSWORD: zawaj
          POSTGRES_DB: zawaj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zawaj"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Integration tests in ./test read this; without it they skip.
      TEST_DATABASE_URL: postgres://zawaj:zawaj@localhost:5432/zawaj_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules tidy
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + cover)
        run: go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: Coverage gate (>= 55%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 55) exit 1 }' \
            || { echo "::error::coverage ${total}% is below the 55% gate"; exit 1; }

      - name: Verify OpenAPI spec is up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/api/main.go --parseInternal --parseDependency -o docs/swagger
          if ! git diff --quiet -- docs/swagger; then
            echo "::error::OpenAPI spec is stale. Run 'make docs' and commit docs/swagger."
            git diff --stat -- docs/swagger
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v2 linter, built with a Go new enough for go.mod (v1.x stops at go1.24).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Known vulnerabilities in stdlib + dependencies that our code actually calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Hard-coded secrets in code or git history.
      - name: gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@latest
          gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

      # Dependency + secret + IaC/Dockerfile misconfiguration scan of the tree.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  image:
    name: docker build · image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t zawaj-api:ci .

      # Scan the built runtime image for OS/package CVEs.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: zawaj-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
