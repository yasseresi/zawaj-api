# Development compose: bundles a throwaway Postgres for local work. Do NOT use in
# production — see docker-compose.prod.yml, which runs the API alone against a
# managed/external database.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zawaj
      POSTGRES_PASSWORD: zawaj
      POSTGRES_DB: zawaj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zawaj"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    # Shutdown drains HTTP (10s), then pushes (5s), then tracing (3s); the
    # default 10s would SIGKILL before pushes are delivered.
    stop_grace_period: 25s
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DATABASE_URL: postgres://zawaj:zawaj@db:5432/zawaj?sslmode=disable
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    ports:
      - "8080:8080"
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
        mode: 0444

volumes:
  pgdata:

secrets:
  firebase_service_account:
    file: ./secrets/zawaj-3e9e1-firebase-adminsdk-fbsvc-db8b07248f.json
