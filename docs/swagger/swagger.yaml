basePath: /api/v1
definitions:
  zawaj_internal_dto.AddNoteRequest:
    properties:
      body:
        maxLength: 2000
        type: string
    required:
    - body
    type: object
  zawaj_internal_dto.AuthResponse:
    properties:
      access:
        type: string
      recovery_code:
        type: string
      refresh:
        type: string
      user:
        $ref: '#/definitions/zawaj_internal_dto.UserResponse'
    type: object
  zawaj_internal_dto.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  zawaj_internal_dto.CreateGuestRequest:
    properties:
      companions:
        maximum: 1000
        minimum: 0
        type: integer
      contact:
        maxLength: 120
        type: string
      full_name:
        maxLength: 120
        type: string
      meal:
        maxLength: 40
        type: string
      note:
        description: optional first note
        maxLength: 2000
        type: string
      relationship:
        maxLength: 80
        type: string
      status:
        enum:
        - pending
        - confirmed
        - declined
        type: string
      table_label:
        maxLength: 40
        type: string
    required:
    - full_name
    type: object
  zawaj_internal_dto.CreateInviteLinkRequest:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  zawaj_internal_dto.CreateWeddingRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      event_date:
        type: string
      name:
        maxLength: 120
        type: string
    required:
    - name
    type: object
  zawaj_internal_dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  zawaj_internal_dto.RecoverRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      recovery_code:
        type: string
      username:
        type: string
    required:
    - new_password
    - recovery_code
    - username
    type: object
  zawaj_internal_dto.RefreshRequest:
    properties:
      refresh:
        type: string
    required:
    - refresh
    type: object
  zawaj_internal_dto.RegisterDeviceRequest:
    properties:
      platform:
        enum:
        - android
        - ios
        - web
        type: string
      token:
        maxLength: 512
        type: string
    required:
    - platform
    - token
    type: object
  zawaj_internal_dto.RegisterRequest:
    properties:
      display_name:
        maxLength: 80
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        description: may be an email
        maxLength: 120
        minLength: 3
        type: string
    required:
    - display_name
    - password
    - username
    type: object
  zawaj_internal_dto.SetRoleRequest:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  zawaj_internal_dto.SetStatusRequest:
    properties:
      status:
        enum:
        - pending
        - confirmed
        - declined
        type: string
    required:
    - status
    type: object
  zawaj_internal_dto.TransferOwnershipRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  zawaj_internal_dto.UnregisterDeviceRequest:
    properties:
      token:
        maxLength: 512
        type: string
    required:
    - token
    type: object
  zawaj_internal_dto.UpdateGuestRequest:
    properties:
      companions:
        maximum: 1000
        minimum: 0
        type: integer
      contact:
        maxLength: 120
        type: string
      full_name:
        maxLength: 120
        type: string
      meal:
        maxLength: 40
        type: string
      relationship:
        maxLength: 80
        type: string
      status:
        enum:
        - pending
        - confirmed
        - declined
        type: string
      table_label:
        maxLength: 40
        type: string
    type: object
  zawaj_internal_dto.UpdateMeRequest:
    properties:
      display_name:
        maxLength: 80
        type: string
    type: object
  zawaj_internal_dto.UpdateSettingsRequest:
    properties:
      dark_mode:
        type: boolean
      email:
        maxLength: 120
        type: string
      notif_email:
        type: boolean
      notif_push:
        type: boolean
      notif_rsvp:
        type: boolean
    type: object
  zawaj_internal_dto.UpdateWeddingRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      event_date:
        type: string
      name:
        maxLength: 120
        type: string
    type: object
  zawaj_internal_dto.UserResponse:
    properties:
      display_name:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  zawaj_pkg_response.APIError:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  zawaj_pkg_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/zawaj_pkg_response.APIError'
    type: object
info:
  contact:
    name: Zawaj
  description: |-
    Wedding guest-list backend. Collaborative RSVP management with
    role-based access (owner/editor/viewer), invite links, stats,
    activity feed, notifications, and CSV export.

    All responses use the envelope `{ "data": ..., "error": null }`.
    On error, `data` is null and `error` is `{ "code", "message", "details" }`.
    Authenticate via `POST /auth/login`, then send `Authorization: Bearer <access>`.
  title: Zawaj API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zawaj_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "423":
          description: Account locked (too many attempts)
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token so it can no longer be rotated.
        Idempotent.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RefreshRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: '{ logged_out: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Log out (revoke a refresh token)
      tags:
      - me
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: Resets the password using the recovery code issued at registration;
        returns a fresh code.
      parameters:
      - description: Recovery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RecoverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zawaj_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "423":
          description: Locked (too many attempts)
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      summary: Recover account with one-time code
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zawaj_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      summary: Refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user and returns tokens plus a one-time recovery code
        (shown once).
      parameters:
      - description: Registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zawaj_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      summary: Register a new account
      tags:
      - auth
  /invite/{token}:
    get:
      consumes:
      - application/json
      description: |-
        Returns wedding name and role for a share token before accepting.
        Hands the wedding to an existing member; the new user becomes owner and the caller is demoted to editor.
      parameters:
      - description: Invite token
        in: path
        name: token
        required: true
        type: string
      - description: New owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.TransferOwnershipRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: '{ transferred: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      - BearerAuth: []
      summary: Transfer ownership (owner only)
      tags:
      - invites
      - members
  /invite/{token}/accept:
    post:
      description: Joins the wedding at the link's role; never downgrades an existing
        higher role.
      parameters:
      - description: Invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zawaj_pkg_response.Envelope'
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Accept an invite
      tags:
      - invites
  /me:
    delete:
      description: Permanently deletes the account and cascades all owned weddings
        and their data.
      produces:
      - application/json
      responses:
        "200":
          description: '{ deleted: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - me
    get:
      consumes:
      - application/json
      description: Revokes the given refresh token so it can no longer be rotated.
        Idempotent.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RefreshRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: '{ logged_out: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Log out (revoke a refresh token)
      tags:
      - me
      - auth
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/zawaj_internal_dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - me
  /me/devices:
    delete:
      consumes:
      - application/json
      description: Removes an FCM token (e.g. on logout). 404 if the token is not
        registered to this user.
      parameters:
      - description: Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.UnregisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{ unregistered: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Unregister a device
      tags:
      - devices
    post:
      consumes:
      - application/json
      description: Upserts an FCM token for the current user. Call after obtaining/refreshing
        the FCM token.
      parameters:
      - description: Token + platform
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: '{ registered: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Register a device for push
      tags:
      - devices
  /me/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Old and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{ changed: true }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - me
  /me/settings:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zawaj_internal_dto.UpdateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update settings/preferences
      tags:
      - me
  /notifications:
    get:
      parameters:
      - description: Only unread when true
        in: query
        name: unread
        type: boolean
      - description: Opaque keyset cursor from a previous response's next_cursor
        in: query
        name: cursor
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{ items: [...], next_cursor: string|null }'
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/zawaj_pkg_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/zawaj_pkg_response.APIError'
