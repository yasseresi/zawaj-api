# Production compose: the API only. The database is NOT bundled here — point
# DATABASE_URL at a managed/external Postgres (RDS, Cloud SQL, Supabase, a
# dedicated DB host, etc.). Secrets come from the environment (inject via your
# orchestrator's secret store or a root-owned .env that is never committed).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (fail-fast if missing): DATABASE_URL, JWT_ACCESS_SECRET,
# JWT_REFRESH_SECRET, CORS_ALLOWED_ORIGINS.
services:
  api:
    build: .
    # Shutdown drains HTTP (10s), then pushes (5s), then tracing (3s); the
    # default 10s would SIGKILL before pushes are delivered.
    stop_grace_period: 25s
    image: zawaj-api:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your managed Postgres}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    ports:
      - "8080:8080"
    # Run behind a TLS-terminating reverse proxy / load balancer; do not expose
    # this port publicly without HTTPS in front.
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
        mode: 0444

secrets:
  firebase_service_account:
    file: ./secrets/zawaj-3e9e1-firebase-adminsdk-fbsvc-db8b07248f.json
